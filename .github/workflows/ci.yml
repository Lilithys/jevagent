name: test
on: [push, pull_request]
jobs:
  test:
    # Apple Silicon, like the machine the phone is attached to; no phone is needed for tests.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check src tests
      - run: uv run pytest
